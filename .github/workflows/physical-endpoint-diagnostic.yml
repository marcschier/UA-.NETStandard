name: Physical endpoint ownership diagnostic

on:
  push:
    branches:
      - diagnostic/physical-endpoint-ownership-20261108

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        framework: [net48, net10.0]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Run endpoint ownership tests
        shell: pwsh
        run: >-
          dotnet test tests/Opc.Ua.Client.Tests/Opc.Ua.Client.Tests.csproj
          -p:CustomTestTarget=${{ matrix.framework }}
          --filter FullyQualifiedName~Opc.Ua.Client.Tests.SessionContexts.SessionRequestContextTests
          -m:1
