name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  NBGV_SetCloudBuildVersionVars: 'false'

jobs:
  pumps-coverage:
    name: Pumps net10 coverage diagnostic
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/run-dotnet-tests
        with:
          projects: tests/Opc.Ua.Pumps.Tests/Opc.Ua.Pumps.Tests.csproj
          custom-test-target: net10.0
          framework: net10.0
          configuration: Release
          dotnet: '10.0.403'
          filter: 'TestCategory!=LongRunning&TestCategory!=Stress'
          hang-timeout: 10m
          per-project-timeout: '45'
          coverage: 'true'
          artifact-name: disposable-pumps-net10-coverage
