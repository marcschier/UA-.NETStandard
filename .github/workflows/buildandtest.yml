name: Vision provider-token paired Windows diagnostic

on:
  workflow_dispatch:
    inputs:
      source_sha:
        required: true
        type: string
      full_fixtures:
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  diagnostic:
    name: Windows ${{ matrix.framework }}
    runs-on: windows-2025
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        framework: [net48, net10.0]
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      MSBUILDDISABLENODEREUSE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Verify immutable source
        shell: pwsh
        env:
          EXPECTED_SOURCE: ${{ inputs.source_sha }}
        run: |
          if ((git rev-parse HEAD^) -ne $env:EXPECTED_SOURCE) { throw 'Unexpected source parent.' }
          $changes = @(git diff --name-only $env:EXPECTED_SOURCE HEAD)
          if ($LASTEXITCODE -ne 0) { throw 'Source comparison failed.' }
          $unexpected = @($changes | Where-Object { -not $_.StartsWith('.github/workflows/') })
          if ($unexpected.Count) { throw "Unexpected source changes: $unexpected" }
          git rev-parse HEAD
          git diff --stat $env:EXPECTED_SOURCE HEAD
      - name: Exact provider-token detachment regression
        shell: pwsh
        run: |
          & .\.github\scripts\run-dotnet-tests.ps1 `
            -Projects 'tests\Opc.Ua.Server.Tests\Opc.Ua.Server.Tests.csproj' `
            -CustomTestTarget '${{ matrix.framework }}' -Framework '${{ matrix.framework }}' `
            -Configuration Debug `
            -Filter 'FullyQualifiedName~Opc.Ua.Server.Tests.FileSystem.FileHandleLifetimeRegressionTests.InlineSessionClosureWaitsForProviderTokenDetachmentAsync' `
            -HangTimeout '3m' -PerProjectTimeoutMinutes 10 `
            -ResultsDirectory 'artifacts\vision-token\exact' -QuietOutput
      - name: Full green lifetime fixtures
        if: ${{ !cancelled() && inputs.full_fixtures }}
        shell: pwsh
        run: |
          & .\.github\scripts\run-dotnet-tests.ps1 `
            -Projects 'tests\Opc.Ua.Server.Tests\Opc.Ua.Server.Tests.csproj' `
            -CustomTestTarget '${{ matrix.framework }}' -Framework '${{ matrix.framework }}' `
            -Configuration Debug `
            -Filter 'FullyQualifiedName~Opc.Ua.Server.Tests.FileSystem.FileHandleLifetimeRegressionTests|FullyQualifiedName~Opc.Ua.Server.Tests.FileSystem.FileTypeBinderLifetimeTests' `
            -HangTimeout '3m' -PerProjectTimeoutMinutes 10 `
            -ResultsDirectory 'artifacts\vision-token\full' -QuietOutput
      - name: Preserve TRX, logs, and verdicts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: vision-token-windows-${{ matrix.framework }}
          path: artifacts\vision-token
          if-no-files-found: error
          retention-days: 14
