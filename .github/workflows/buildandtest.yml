name: PackML folder diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  TEMP: D:\temp
  TMP: D:\temp
  NBGV_SetCloudBuildVersionVars: 'false'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  packml-folder:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Prepare temporary directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path 'D:\temp' | Out-Null

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Check existing restore assets
        id: assets
        shell: pwsh
        run: |
          $project = 'tests\Opc.Ua.PackML.Tests\Opc.Ua.PackML.Tests.csproj'
          $log = 'D:\temp\packml-folder-no-restore.log'
          & dotnet build $project --no-restore --framework net10.0 -p:CustomTestTarget=net10.0 -m:1 -nr:false *> $log
          $code = $LASTEXITCODE
          if ($code -eq 0) {
            'restore_required=false' >> $env:GITHUB_OUTPUT
          } elseif (Select-String -Path $log -Pattern 'NETSDK1004' -Quiet) {
            'restore_required=true' >> $env:GITHUB_OUTPUT
            Write-Host 'The clean checkout has no NuGet assets; restoring the selected project.'
          } else {
            Get-Content -Path $log
            exit $code
          }
          exit 0

      - name: Restore missing assets
        if: steps.assets.outputs.restore_required == 'true'
        shell: pwsh
        run: |
          dotnet restore 'tests\Opc.Ua.PackML.Tests\Opc.Ua.PackML.Tests.csproj' --disable-parallel -p:CustomTestTarget=net10.0 -m:1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Browse PackMLObjects through a real session
        shell: pwsh
        run: |
          dotnet test 'tests\Opc.Ua.PackML.Tests\Opc.Ua.PackML.Tests.csproj' --no-restore --configuration Debug --framework net10.0 -p:CustomTestTarget=net10.0 -m:1 -nr:false --filter 'FullyQualifiedName~StandaloneUnitIsOrganizedBelowPackMLObjectsAsync' --logger 'trx;LogFileName=packml-folder.trx' --results-directory 'D:\temp\packml-folder-results' --blame-hang-timeout 2m
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Preserve test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: packml-folder-diagnostic
          path: D:\temp\packml-folder-results
          if-no-files-found: warn
          retention-days: 7
