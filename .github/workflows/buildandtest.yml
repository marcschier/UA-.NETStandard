name: AutoID isolated coverage diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  NBGV_SetCloudBuildVersionVars: 'false'

jobs:
  autoid:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        path: candidate
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        ref: e4c6a5ebd96d3281fc8f1c592b166775607481df
        path: baseline
    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.403'
    - name: AutoID baseline, focused candidate and coverage
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $results = Join-Path $env:GITHUB_WORKSPACE 'diagnostic-results'
        New-Item -ItemType Directory -Path $results -Force | Out-Null
        "diagnostic_sha=$env:GITHUB_SHA" | Set-Content (Join-Path $results 'identity.txt')
        'baseline_sha=e4c6a5ebd96d3281fc8f1c592b166775607481df' |
          Add-Content (Join-Path $results 'identity.txt')

        function Invoke-AutoIdTests {
          param([string]$Checkout, [string]$Framework, [string]$Label,
                [string]$Filter, [bool]$Coverage)
          Push-Location (Join-Path $env:GITHUB_WORKSPACE $Checkout)
          try {
            $project = 'tests\Opc.Ua.AutoID.Tests\Opc.Ua.AutoID.Tests.csproj'
            $destination = Join-Path $results $Label
            New-Item -ItemType Directory -Path $destination -Force | Out-Null
            $arguments = @('test', $project, '--no-restore', '-c', 'Release',
              '-f', $Framework, "-p:CustomTestTarget=$Framework",
              '--filter', $Filter, '--logger', "trx;LogFileName=$Label.trx",
              '--results-directory', $destination, '--blame-hang-timeout', '10m')
            if ($Coverage) {
              $arguments += @('--collect', 'XPlat Code Coverage')
            }
            & dotnet @arguments 2>&1 | Tee-Object -FilePath (Join-Path $destination 'initial.log')
            $exitCode = $LASTEXITCODE
            if ($exitCode -ne 0 -and
                (Select-String -Path (Join-Path $destination 'initial.log') -Pattern 'NETSDK1004' -Quiet)) {
              & dotnet restore $project "-p:CustomTestTarget=$Framework" 2>&1 |
                Tee-Object -FilePath (Join-Path $destination 'restore.log')
              if ($LASTEXITCODE -ne 0) {
                throw "Restore failed for $Label."
              }
              & dotnet @arguments 2>&1 | Tee-Object -FilePath (Join-Path $destination 'test.log')
              $exitCode = $LASTEXITCODE
            }
            if ($exitCode -ne 0) {
              throw "$Label failed with exit code $exitCode."
            }
            [xml]$trx = Get-Content -Raw (Join-Path $destination "$Label.trx")
            $counters = $trx.TestRun.ResultSummary.Counters
            if ([int]$counters.passed -lt 1 -or [int]$counters.failed -ne 0 -or
                [int]$counters.error -ne 0 -or [int]$counters.timeout -ne 0 -or
                [int]$counters.aborted -ne 0) {
              throw "Unexpected test verdict for $Label."
            }
            "$Label : $($counters.passed) passed, $($counters.failed) failed" |
              Tee-Object -FilePath (Join-Path $results 'verdicts.txt') -Append
          }
          finally {
            Pop-Location
          }
        }

        $suiteFilter = 'TestCategory!=LongRunning&TestCategory!=Stress'
        Invoke-AutoIdTests baseline net10.0 baseline-net10 $suiteFilter $true
        Invoke-AutoIdTests candidate net10.0 focused-net10 `
          'FullyQualifiedName~AutoIdClientBranchTests' $false
        Invoke-AutoIdTests candidate net10.0 candidate-net10 $suiteFilter $true
        Invoke-AutoIdTests candidate net48 focused-net48 `
          'FullyQualifiedName~AutoIdClientBranchTests' $false
        Invoke-AutoIdTests candidate net48 candidate-net48 $suiteFilter $false

        $comparison = foreach ($label in @('baseline-net10', 'candidate-net10')) {
          $reports = @(Get-ChildItem (Join-Path $results $label) -Filter coverage.cobertura.xml -Recurse)
          if ($reports.Count -ne 1) {
            throw "Expected one Cobertura report for $label; found $($reports.Count)."
          }
          [xml]$coverage = Get-Content -Raw $reports[0].FullName
          $package = @($coverage.coverage.packages.package |
            Where-Object { $_.name -eq 'Opc.Ua.AutoID.Client' })
          if ($package.Count -ne 1) {
            throw "Expected AutoID client coverage package for $label."
          }
          [pscustomobject]@{
            Label = $label
            Package = $package[0].name
            LineRate = $package[0].GetAttribute('line-rate')
            BranchRate = $package[0].GetAttribute('branch-rate')
          }
        }
        $comparison | ConvertTo-Json | Set-Content (Join-Path $results 'coverage-comparison.json')
        $comparison | Format-Table | Out-String | Add-Content $env:GITHUB_STEP_SUMMARY
        Get-Content (Join-Path $results 'verdicts.txt') | Add-Content $env:GITHUB_STEP_SUMMARY
        'Targeted AutoID diagnostic only; not full solution or PR qualification.' |
          Add-Content $env:GITHUB_STEP_SUMMARY
    - name: Preserve diagnostic evidence
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: autoid-isolated-diagnostic-${{ github.sha }}
        path: diagnostic-results
        if-no-files-found: error
