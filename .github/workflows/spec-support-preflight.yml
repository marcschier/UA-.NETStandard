name: Supplemental split test preflight
run-name: PackML at b22aa1c192e6b7191b01bcfbbce0b9ff7f7910fa

on:
  push:
    branches: [marcschier-spec-support-ci-preflight]

permissions:
  contents: read

env:
  NBGV_SetCloudBuildVersionVars: 'false'
  TEMP: D:\temp
  TMP: D:\temp

jobs:
  managed:
    name: PackML VSTest ${{ matrix.framework }}
    runs-on: windows-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        framework: [net48, net10.0]
    steps:
    - name: Configure temporary directory
      shell: pwsh
      run: New-Item -ItemType Directory -Force -Path 'D:\temp' | Out-Null

    - name: Probe temporary-directory ACL inheritance
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $probe = Join-Path $env:TEMP "spec-acl-$([guid]::NewGuid().ToString('N'))"
        $identity = [System.Security.Principal.WindowsIdentity]::GetCurrent()
        function Set-UserOnlyAcl([string] $path) {
            $security = [System.Security.AccessControl.DirectorySecurity]::new()
            $security.SetAccessRuleProtection($true, $false)
            $inheritance = [System.Security.AccessControl.InheritanceFlags]::ContainerInherit -bor
                [System.Security.AccessControl.InheritanceFlags]::ObjectInherit
            $rule = [System.Security.AccessControl.FileSystemAccessRule]::new(
                $identity.User,
                [System.Security.AccessControl.FileSystemRights]::FullControl,
                $inheritance,
                [System.Security.AccessControl.PropagationFlags]::None,
                [System.Security.AccessControl.AccessControlType]::Allow)
            $security.AddAccessRule($rule)
            [System.IO.FileSystemAclExtensions]::SetAccessControl(
                [System.IO.DirectoryInfo]::new($path), $security)
        }
        try {
            $null = New-Item -ItemType Directory -Path $probe
            foreach ($case in @('inherited-default', 'controlled-parent')) {
                $parent = Join-Path $probe $case
                $null = New-Item -ItemType Directory -Path $parent
                if ($case -eq 'controlled-parent') {
                    Set-UserOnlyAcl $parent
                }
                $root = Join-Path $parent 'store'
                $private = Join-Path $root 'private'
                $null = New-Item -ItemType Directory -Force -Path $private
                Set-UserOnlyAcl $root
                $directory = [System.IO.DirectoryInfo]::new($private)
                $security = [System.IO.FileSystemAclExtensions]::GetAccessControl($directory)
                $explicit = @($security.GetAccessRules(
                    $true, $false, [System.Security.Principal.SecurityIdentifier]))
                $inherited = @($security.GetAccessRules(
                    $false, $true, [System.Security.Principal.SecurityIdentifier]))
                Write-Host "${case}: explicit=$($explicit.Count), inherited=$($inherited.Count)"
                foreach ($rule in $explicit) {
                    $principal = if ($rule.IdentityReference -eq $identity.User) {
                        'current user'
                    } elseif ($rule.IdentityReference.Value -eq 'S-1-3-0') {
                        'creator owner'
                    } elseif ($rule.IdentityReference.Value -eq 'S-1-5-18') {
                        'local system'
                    } elseif ($rule.IdentityReference.Value -eq 'S-1-5-32-544') {
                        'administrators'
                    } else {
                        'other'
                    }
                    Write-Host "  $principal $($rule.FileSystemRights) $($rule.InheritanceFlags)"
                }
            }
        } finally {
            $identity.Dispose()
            if (Test-Path -LiteralPath $probe) {
                Remove-Item -LiteralPath $probe -Recurse -Force
            }
        }

    - name: Checkout implementation
      uses: actions/checkout@v7
      with:
        repository: OPCFoundation/UA-.NETStandard
        ref: b22aa1c192e6b7191b01bcfbbce0b9ff7f7910fa
        fetch-depth: 0
        persist-credentials: false

    - name: Verify implementation commit
      shell: pwsh
      run: |
        $actual = (& git rev-parse HEAD).Trim()
        if ($actual -ne 'b22aa1c192e6b7191b01bcfbbce0b9ff7f7910fa') {
            throw "Checked out $actual, expected b22aa1c192e6b7191b01bcfbbce0b9ff7f7910fa."
        }
        Write-Host "Testing OPCFoundation/UA-.NETStandard at $actual."

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.402'

    - name: Set cloud version
      shell: pwsh
      run: .\.azurepipelines\set-version.ps1

    - name: Run and verify unfiltered VSTest projects
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $framework = '${{ matrix.framework }}'
        [xml]$sourceSolution = Get-Content -Raw -LiteralPath 'UA.slnx'
        $sourceProjects = @($sourceSolution.SelectNodes('//Project') | ForEach-Object { $_.GetAttribute('Path') })
        $aotProjects = @(
          'tests/Opc.Ua.Aot.Tests/Opc.Ua.Aot.Tests.csproj',
          'tests/Opc.Ua.Aot.Tests.Historian/Opc.Ua.Aot.Tests.Historian.csproj',
          'tests/Opc.Ua.Aot.Tests.Mcp/Opc.Ua.Aot.Tests.Mcp.csproj'
        )
        foreach ($project in $aotProjects) {
            if (@($sourceProjects | Where-Object { $_ -ceq $project }).Count -ne 1) {
                throw "Expected exactly one solution entry for '$project'."
            }
        }

        $solution = 'UA.slnx'
        if ($framework -eq 'net10.0') {
            foreach ($project in $aotProjects) {
                $node = @($sourceSolution.SelectNodes('//Project') |
                    Where-Object { $_.GetAttribute('Path') -ceq $project })[0]
                $null = $node.ParentNode.RemoveChild($node)
            }
            $remaining = @($sourceSolution.SelectNodes('//Project') |
                ForEach-Object { $_.GetAttribute('Path') })
            $expected = @($sourceProjects | Where-Object { $_ -cnotin $aotProjects })
            if (Compare-Object $expected $remaining -CaseSensitive) {
                throw 'The generated VSTest solution does not contain exactly the expected projects.'
            }
            $solutionDirectory = (New-Item -ItemType Directory -Force `
              -Path 'obj\spec-support-preflight').FullName
            foreach ($node in $sourceSolution.SelectNodes('//*[@Path]')) {
                $original = $node.GetAttribute('Path').Replace('/', '\')
                $absolute = [System.IO.Path]::GetFullPath($original, (Get-Location).Path)
                $relative = [System.IO.Path]::GetRelativePath($solutionDirectory, $absolute)
                $resolved = [System.IO.Path]::GetFullPath($relative, $solutionDirectory)
                if ($resolved -cne $absolute) {
                    throw "Relocated solution path '$relative' does not resolve to '$absolute'."
                }
                $node.SetAttribute('Path', $relative)
            }
            $solution = Join-Path $solutionDirectory 'UA.Preflight.VSTest.slnx'
            $sourceSolution.Save($solution)
            Write-Host "Running $solution; the three TUnit projects run separately as NativeAOT."
        }

        dotnet test $solution --configuration Release `
          "/p:CustomTestTarget=$framework" -m:2 --logger trx
        $testExitCode = $LASTEXITCODE
        . .\.github\scripts\get-test-verdict.ps1
        $results = Measure-TestResults (Get-Location).Path
        Write-Host "TRX files: $($results.Files); total: $($results.Total); passed: $($results.Passed); nonpassing: $($results.Failed)"
        $verdict = Get-TestRunVerdict `
          -TrxFileCount $results.Files `
          -Total $results.Total `
          -Passed $results.Passed `
          -Failed $results.Failed `
          -FixtureFailures $results.FixtureFailures `
          -ExitCode $testExitCode `
          -TimedOut $false
        if ($testExitCode -ne 0 -or -not $verdict.Passed) {
            throw "VSTest solution exit code $testExitCode. $($verdict.Reason)"
        }

        $records = [System.Collections.Generic.List[object]]::new()
        foreach ($project in $sourceProjects) {
            if ($project -cin $aotProjects) {
                continue
            }
            $path = $project.Replace('/', '\')
            $output = (& dotnet msbuild $path `
              '-getProperty:IsTestProject;TargetFrameworks;TargetFramework;_StressTestSupportedTarget' `
              "-p:CustomTestTarget=$framework" '-p:Configuration=Release' '-nologo' | Out-String)
            if ($LASTEXITCODE -ne 0) {
                throw "Could not evaluate '$path' for $framework."
            }
            $start = $output.IndexOf('{')
            $end = $output.LastIndexOf('}')
            if ($start -lt 0 -or $end -le $start) {
                throw "No property document for '$path': $output"
            }
            $properties = ($output.Substring($start, $end - $start + 1) | ConvertFrom-Json).Properties
            if ($properties.IsTestProject -ne 'true') {
                continue
            }
            if ($framework -eq 'net48' -and
                $path -ieq 'tests\Opc.Ua.Stress.Tests\Opc.Ua.Stress.Tests.csproj' -and
                $properties._StressTestSupportedTarget -eq 'false') {
                $records.Add([pscustomobject]@{
                    Project = $path
                    Framework = $framework
                    Files = 0
                    Total = 0
                    Passed = 0
                    Failed = 0
                    Verdict = 'not applicable: net48 placeholder'
                })
                continue
            }
            $projectResults = Measure-TestResults (Join-Path (Split-Path $path -Parent) 'TestResults')
            $projectVerdict = Get-TestRunVerdict `
              -TrxFileCount $projectResults.Files `
              -Total $projectResults.Total `
              -Passed $projectResults.Passed `
              -Failed $projectResults.Failed `
              -FixtureFailures $projectResults.FixtureFailures `
              -ExitCode 0 `
              -TimedOut $false
            $records.Add([pscustomobject]@{
                Project = $path
                Framework = $framework
                Files = $projectResults.Files
                Total = $projectResults.Total
                Passed = $projectResults.Passed
                Failed = $projectResults.Failed
                Verdict = if ($projectVerdict.Passed) { 'passed' } else { $projectVerdict.Reason }
            })
        }
        $records | Format-Table -AutoSize
        $records | Export-Csv -NoTypeInformation -Path "D:\temp\project-results-$framework.csv"
        $passedProjects = @($records | Where-Object { $_.Verdict -eq 'passed' })
        $invalid = @($records | Where-Object {
            $_.Verdict -ne 'passed' -and $_.Verdict -ne 'not applicable: net48 placeholder'
        })
        if ($passedProjects.Count -eq 0 -or $invalid.Count -gt 0) {
            throw "Per-project evidence is missing or failing for $($invalid.Count) of $($records.Count) projects."
        }

    - name: Stage test results
      if: always()
      shell: pwsh
      run: |
        $output = 'D:\temp\solution-results'
        New-Item -ItemType Directory -Force -Path $output | Out-Null
        $files = @(Get-ChildItem -Path . -Recurse -File -Filter *.trx)
        foreach ($file in $files) {
            Copy-Item -LiteralPath $file.FullName -Destination (Join-Path $output "$([guid]::NewGuid()).trx")
        }
        Get-ChildItem -Path 'D:\temp' -Filter 'project-results-*.csv' |
          Copy-Item -Destination $output
        Write-Host "Staged $($files.Count) TRX files."

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: PackML-vstest-${{ matrix.framework }}
        path: D:\temp\solution-results
        if-no-files-found: warn

  aot:
    name: PackML NativeAOT net10.0
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
    - name: Configure temporary directory
      shell: pwsh
      run: New-Item -ItemType Directory -Force -Path 'D:\temp' | Out-Null

    - name: Checkout implementation
      uses: actions/checkout@v7
      with:
        repository: OPCFoundation/UA-.NETStandard
        ref: b22aa1c192e6b7191b01bcfbbce0b9ff7f7910fa
        fetch-depth: 0
        persist-credentials: false

    - name: Verify implementation commit
      shell: pwsh
      run: |
        $actual = (& git rev-parse HEAD).Trim()
        if ($actual -ne 'b22aa1c192e6b7191b01bcfbbce0b9ff7f7910fa') {
            throw "Checked out $actual, expected b22aa1c192e6b7191b01bcfbbce0b9ff7f7910fa."
        }
        Write-Host "Testing OPCFoundation/UA-.NETStandard at $actual."

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.402'

    - name: Set cloud version
      shell: pwsh
      run: .\.azurepipelines\set-version.ps1

    - name: Publish and run every NativeAOT test project
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        . .\.github\scripts\get-test-verdict.ps1
        $projects = @(
          'tests\Opc.Ua.Aot.Tests\Opc.Ua.Aot.Tests.csproj',
          'tests\Opc.Ua.Aot.Tests.Historian\Opc.Ua.Aot.Tests.Historian.csproj',
          'tests\Opc.Ua.Aot.Tests.Mcp\Opc.Ua.Aot.Tests.Mcp.csproj'
        )
        foreach ($project in $projects) {
            $stem = [System.IO.Path]::GetFileNameWithoutExtension($project)
            Write-Host "::group::$stem (win-x64)"
            dotnet publish $project --configuration Release --runtime win-x64 `
              --self-contained true '/p:CustomTestTarget=net10.0' -m:2
            if ($LASTEXITCODE -ne 0) {
                throw "NativeAOT publish failed for '$project' with exit code $LASTEXITCODE."
            }
            $publish = Join-Path (Split-Path $project -Parent) 'bin\Release\net10.0\win-x64\publish'
            $executable = Join-Path $publish "$stem.exe"
            if (-not (Test-Path -LiteralPath $executable -PathType Leaf) -or
                (Test-Path -LiteralPath (Join-Path $publish 'coreclr.dll'))) {
                throw "NativeAOT executable missing or managed runtime detected at '$publish'."
            }
            $resultsDirectory = Join-Path 'D:\temp\aot-results' $stem
            New-Item -ItemType Directory -Force -Path $resultsDirectory | Out-Null
            & $executable --report-trx --results-directory $resultsDirectory
            $testExitCode = $LASTEXITCODE
            $results = Measure-TestResults $resultsDirectory
            $verdict = Get-TestRunVerdict `
              -TrxFileCount $results.Files `
              -Total $results.Total `
              -Passed $results.Passed `
              -Failed $results.Failed `
              -FixtureFailures $results.FixtureFailures `
              -ExitCode $testExitCode `
              -TimedOut $false
            Write-Host "$stem TRX files: $($results.Files); total: $($results.Total); passed: $($results.Passed); nonpassing: $($results.Failed)"
            if ($testExitCode -ne 0 -or -not $verdict.Passed) {
                throw "NativeAOT tests failed for '$project' with exit code $testExitCode. $($verdict.Reason)"
            }
            Write-Host '::endgroup::'
        }

    - name: Upload NativeAOT results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: PackML-nativeaot-net10.0
        path: D:\temp\aot-results
        if-no-files-found: warn
